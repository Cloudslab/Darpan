name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/darpan-rl
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src packages/darpan-rl/src tests
      - name: Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin
          tests/unit tests/contract tests/integration tests/end_to_end
      - name: Runtime quickstart
        working-directory: /tmp
        run: darpan run "$GITHUB_WORKSPACE/configs/experiments/quickstart.yaml"
      - name: Control interface smoke test
        run: python examples/control/actions.py
